{% extends "base.html" %}
{% block content %}
  <section class="card">
    <h1>{{ quiz_title if quiz_title else "Awareness Quiz" }}</h1>
    <p class="muted">
      Questions are tailored to your role and department.
    </p>
    <div id="quiz-app"
         data-quiz='{{ quiz | tojson }}'
         data-scenario='{{ scenario if scenario else "" }}'
         data-submit-url='{{ url_for("submit") }}'
         data-results-url='{{ url_for("results") }}'>
    </div>
  </section>

  <script src="{{ url_for('static', filename='js/quiz.js') }}"></script>
{% endblock %}
