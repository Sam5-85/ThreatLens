{% extends "base.html" %}
{% block content %}
  <section class="card">
    <h1>Awareness Quiz</h1>
    <p class="muted">Answer the questions. Your results are stored only in your browser session.</p>

    <div id="quiz-app"
         data-quiz='{{ quiz | tojson }}'
         data-submit-url='{{ url_for("submit") }}'
         data-results-url='{{ url_for("results") }}'>
    </div>
  </section>

  <script src="{{ url_for('static', filename='js/quiz.js') }}"></script>
{% endblock %}
