{% extends "base.html" %}
{% block content %}
  <section class="card">
    <div class="email-header">
      <div>
        <h1 class="subject">{{ email.subject }}</h1>
        <div class="sender muted">From: {{ email.sender }}</div>
      </div>
      <a class="btn ghost" href="{{ url_for('index') }}">Back</a>
    </div>

    <div class="email-body">
      {{ email.body_html | safe }}
    </div>

    <details class="hint">
      <summary>Not sure? Reveal common red flags</summary>
      <ul>
        {% for rf in email.red_flags %}
          <li>{{ rf }}</li>
        {% endfor %}
      </ul>
    </details>
  </section>
{% endblock %}
